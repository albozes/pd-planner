<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD Planner Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>PD Planner Web</h1>
    <div id="toolbar">
        <input type="file" id="imageLoader" accept="image/*">
        <button id="addTextBtn">Add Text</button>
        <button id="lineBtn">Draw Line</button>
        <label>Line Width <input type="range" id="lineWidth" min="1" max="5" value="1"></label>
        <label><input type="checkbox" id="gridToggle" checked> Show Grid</label>
        <label><input type="checkbox" id="bgToggle"> Dark BG</label>
        <span id="cursorPos"></span>
    </div>
    <canvas id="playdate" width="400" height="240"></canvas>

    <script src="main.js"></script>
</body>
</html>
